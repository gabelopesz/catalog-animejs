<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slideshow Ken Burns</title>

<!-- Bootstrap 5 (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.bunny.net/css?family=jura:300,500" rel="stylesheet">

<style>
  :root{
    --brand-green: #2e9e4f;
  }

  html, body{
    height: 100%;
    font-family: 'Jura', system-ui, sans-serif;
  }

  body{
    background: radial-gradient(circle at 50% 30%, #0f1f14 0%, #0a140d 60%, #060a07 100%);
  }

  .stage{
    min-height: 100vh;
  }

  .hint{
    color: var(--brand-green);
    letter-spacing: .02em;
  }

  /* --- Ken Burns --------------------------------------------------------- */
  .kb{
    position: relative;
    width: min(100%, 800px);
    aspect-ratio: 16 / 9;
    border: 4px solid var(--brand-green);
    background: #060a07;
    overflow: hidden;
  }

  .kb-layer{
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    will-change: transform, opacity;
  }

  .kb-shade{
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(6,10,7,.85) 0%, rgba(6,10,7,0) 45%);
    pointer-events: none;
  }

  .kb-caption{
    position: absolute;
    left: 1.25rem;
    right: 1.25rem;
    bottom: 1.5rem;
    margin: 0;
    color: #fff;
    font-size: 1.5rem;
    letter-spacing: .02em;
    text-shadow: 0 1px 6px rgba(0,0,0,.7);
  }

  .kb-progress{
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255,255,255,.15);
  }

  .kb-progress > i{
    display: block;
    height: 100%;
    background: var(--brand-green);
    transform: scaleX(0);
    transform-origin: left center;
  }

  .kb-dot{
    width: 10px;
    height: 10px;
    padding: 0;
    border: 1px solid var(--brand-green);
    border-radius: 50%;
    background: transparent;
    transition: background-color .2s ease, transform .2s ease;
  }

  .kb-dot.is-active{
    background: var(--brand-green);
    transform: scale(1.3);
  }
</style>
</head>
<body>

<div class="stage d-flex flex-column align-items-center justify-content-center gap-4 py-5">

  <p class="hint small text-uppercase mb-0">zoom lento + panorâmica, com crossfade entre as fotos</p>

  <div class="kb" id="kb">
    <div class="kb-layers" id="layers"></div>
    <div class="kb-shade"></div>
    <p class="kb-caption" id="caption"></p>
    <div class="kb-progress"><i id="bar"></i></div>
  </div>

  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-outline-success btn-sm" id="toggle" type="button">Pausar</button>
    <div class="d-flex align-items-center gap-2" id="dots"></div>
  </div>

</div>

<!-- anime.js (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

<script>
(function () {
  var SLIDES = [
    { src: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80', title: 'Floresta ao amanhecer' },
    { src: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=80', title: 'Montanha na neblina' },
    { src: 'https://images.unsplash.com/photo-1493397212122-2b85dda8106b?auto=format&fit=crop&w=1600&q=80', title: 'Concreto e curvas' },
    { src: 'https://images.unsplash.com/photo-1524126675694-1efa3488b7c0?auto=format&fit=crop&w=1600&q=80', title: 'Vale ao entardecer' }
  ];

  // Deslocamento (em % do próprio elemento) de cada slide. Mantido bem abaixo
  // da sobra gerada pelo zoom para nunca revelar a borda da imagem.
  var PANS = [
    { x: -2.5, y: -1.5 },
    { x:  2.5, y:  1.5 },
    { x:  2.0, y: -2.0 },
    { x: -2.0, y:  2.0 }
  ];

  var ZOOM_FROM = 1.12;
  var ZOOM_TO = 1.28;
  var HOLD = 5200;   // tempo visível de cada slide
  var FADE = 900;    // duração do crossfade

  var layersBox = document.getElementById('layers');
  var dotsBox = document.getElementById('dots');
  var caption = document.getElementById('caption');
  var bar = document.getElementById('bar');
  var toggle = document.getElementById('toggle');

  var layers = [];
  var dots = [];
  var index = -1;
  var playing = true;
  var zoomTween = null;
  var timerTween = null;

  SLIDES.forEach(function (slide, i) {
    var layer = document.createElement('div');
    layer.className = 'kb-layer';
    layer.style.backgroundImage = 'url(' + slide.src + ')';
    layersBox.appendChild(layer);
    layers.push(layer);

    var dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'kb-dot';
    dot.setAttribute('aria-label', 'Ir para ' + slide.title);
    dot.addEventListener('click', function () { go(i); });
    dotsBox.appendChild(dot);
    dots.push(dot);
  });

  function startTimer() {
    anime.remove(bar);
    anime.set(bar, { scaleX: 0 });
    timerTween = anime({
      targets: bar,
      scaleX: 1,
      duration: HOLD,
      easing: 'linear',
      complete: function () {
        if (playing) go((index + 1) % SLIDES.length);
      }
    });
  }

  function go(next) {
    if (next === index) return;

    var prev = layers[index];
    var cur = layers[next];
    var pan = PANS[next % PANS.length];
    index = next;

    // `cur` pode estar no meio de um fade-out anterior: limpa antes de reiniciar.
    anime.remove(cur);
    anime.set(cur, { opacity: 0, translateX: -pan.x + '%', translateY: -pan.y + '%', scale: ZOOM_FROM });

    anime({ targets: cur, opacity: 1, duration: FADE, easing: 'linear' });
    if (prev) anime({ targets: prev, opacity: 0, duration: FADE, easing: 'linear' });

    // O movimento cobre o slide inteiro (exibição + crossfade de saída).
    zoomTween = anime({
      targets: cur,
      translateX: pan.x + '%',
      translateY: pan.y + '%',
      scale: ZOOM_TO,
      duration: HOLD + FADE,
      easing: 'linear'
    });

    caption.textContent = SLIDES[next].title;
    anime.remove(caption);
    anime({ targets: caption, opacity: [0, 1], translateY: [12, 0], duration: 600, easing: 'easeOutQuad' });

    dots.forEach(function (dot, i) { dot.classList.toggle('is-active', i === next); });

    startTimer();
    if (!playing) setPlaying(false);
  }

  function setPlaying(value) {
    playing = value;
    toggle.textContent = value ? 'Pausar' : 'Retomar';
    if (zoomTween) value ? zoomTween.play() : zoomTween.pause();
    if (timerTween) value ? timerTween.play() : timerTween.pause();
  }

  toggle.addEventListener('click', function () { setPlaying(!playing); });

  go(0);
})();
</script>

</body>
</html>
