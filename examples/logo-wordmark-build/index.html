<title>Abertura de Marca</title>

<!-- Bootstrap 5 (CDN) -->

<style>
  :root{
    --brand-green: #2e9e4f;
  }

  html, body{
    height: 100%;
  }

  body{
    background: radial-gradient(circle at 50% 30%, #0f1f14 0%, #0a140d 60%, #060a07 100%);
    color: #f5f5f5;
    overflow: hidden;
  }

  .stage{
    height: 100vh;
  }

  .lockup{
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  .leaf-svg{
    width: 96px;
    height: 96px;
    flex: none;
  }

  .leaf-svg path{
    fill: var(--brand-green);
  }

  /* barra que separa símbolo e wordmark */
  .rule{
    width: 2px;
    height: 72px;
    background: var(--brand-green);
    transform: scaleY(0);
    transform-origin: center;
  }

  .wordmark{
    position: relative;
    overflow: hidden;
    padding: .25rem .1rem;
  }

  .wordmark .letter{
    display: inline-block;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-weight: 600;
    font-size: clamp(2rem, 8vw, 4rem);
    line-height: 1;
    letter-spacing: .01em;
    color: #f5f5f5;
    opacity: 0;
    will-change: transform, opacity;
  }

  /* faixa de brilho que varre o wordmark no fim da montagem */
  .shine{
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 35%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.6) 50%, transparent 100%);
    transform: translateX(-160%);
    pointer-events: none;
  }

  .tagline{
    margin: .5rem 0 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: .9rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--brand-green);
    opacity: 0;
  }

  .replay-btn{
    position: fixed;
    bottom: 24px;
    right: 24px;
  }
</style>
</head>

      <div class="wordmark" id="wordmark" data-text="Acme">
        <span class="shine" id="shine"></span>
      </div>
      <p class="tagline" id="tagline">soluções modulares</p>
    </div>

<button id="replay" class="btn btn-outline-success btn-sm replay-btn" type="button">↻ Repetir</button>

<!-- anime.js (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

<script>
(function () {
  var wordmark = document.getElementById('wordmark');
  var shine = document.getElementById('shine');
  var leaf = document.getElementById('leaf');
  var rule = document.getElementById('rule');
  var tagline = document.getElementById('tagline');
  var replay = document.getElementById('replay');

  // Uma <span> por letra: é o que permite o stagger no wordmark.
  var letters = wordmark.dataset.text.split('').map(function (char) {
    var span = document.createElement('span');
    span.className = 'letter';
    span.textContent = char === ' ' ? ' ' : char;
    wordmark.insertBefore(span, shine);
    return span;
  });

  function play() {
    anime.remove([leaf, rule, tagline, shine].concat(letters));

    anime.set(leaf, { opacity: 0, scale: .2, rotate: -35 });
    anime.set(rule, { scaleY: 0 });
    anime.set(letters, { opacity: 0, translateY: 42, rotate: 8 });
    anime.set(tagline, { opacity: 0, letterSpacing: '.6em' });
    anime.set(shine, { translateX: '-160%' });

    anime.timeline()
      .add({
        targets: leaf,
        opacity: [0, 1],
        scale: [.2, 1],
        rotate: [-35, 0],
        duration: 1100,
        easing: 'easeOutElastic(1, .6)'
      })
      .add({
        targets: rule,
        scaleY: [0, 1],
        duration: 450,
        easing: 'easeOutQuart'
      }, '-=700')
      .add({
        targets: letters,
        opacity: [0, 1],
        translateY: [42, 0],
        rotate: [8, 0],
        duration: 800,
        easing: 'easeOutExpo',
        delay: anime.stagger(55)
      }, '-=300')
      .add({
        targets: shine,
        translateX: ['-160%', '360%'],
        duration: 850,
        easing: 'easeInOutQuad'
      }, '-=250')
      .add({
        targets: tagline,
        opacity: [0, 1],
        letterSpacing: ['.6em', '.3em'],
        duration: 700,
        easing: 'easeOutQuad'
      }, '-=600');
  }

  replay.addEventListener('click', play);
  play();
})();
</script>
