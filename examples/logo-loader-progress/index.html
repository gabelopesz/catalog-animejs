<!-- anime.js (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

<script>
(function () {
  var VIEW = 64;

  // Carregamento simulado: patamares com pausas, como um download real.
  var STEPS = [
    { value: 18,  duration: 600,  gap: 0 },
    { value: 34,  duration: 900,  gap: 150 },
    { value: 41,  duration: 500,  gap: 400 },
    { value: 68,  duration: 1100, gap: 120 },
    { value: 75,  duration: 400,  gap: 350 },
    { value: 92,  duration: 900,  gap: 100 },
    { value: 100, duration: 700,  gap: 250 }
  ];

  var logo = document.getElementById('logo');
  var clipRect = document.getElementById('clipRect');
  var readout = document.getElementById('readout');
  var bar = document.getElementById('bar');
  var restart = document.getElementById('restart');

  var outlinePaths = Array.prototype.slice.call(
    document.getElementById('outline').querySelectorAll('path')
  );

  var lengths = outlinePaths.map(function (path) {
    var length = path.getTotalLength();
    path.style.strokeDasharray = length;
    return length;
  });

  var progress = { value: 0 };
  var timeline = null;

  // Um único valor governa os três canais visuais.
  function render() {
    var ratio = progress.value / 100;

    outlinePaths.forEach(function (path, i) {
      path.style.strokeDashoffset = lengths[i] * (1 - ratio);
    });

    clipRect.setAttribute('y', (VIEW - VIEW * ratio).toFixed(2));
    readout.textContent = Math.round(progress.value) + '%';
    bar.style.transform = 'scaleX(' + ratio + ')';
  }

  function run() {
    if (timeline) timeline.pause();
    anime.remove(logo);
    anime.remove(readout);

    progress.value = 0;
    render();
    anime.set(logo, { scale: 1 });
    restart.disabled = true;

    timeline = anime.timeline({
      easing: 'easeInOutSine',
      update: render,
      complete: function () {
        restart.disabled = false;
        readout.textContent = 'pronto';
        anime({ targets: logo, scale: [1, 1.06, 1], duration: 700, easing: 'easeOutQuad' });
        anime({ targets: readout, opacity: [.3, 1], duration: 500, easing: 'easeOutQuad' });
      }
    });

    STEPS.forEach(function (step) {
      var tween = { targets: progress, value: step.value, duration: step.duration };
      if (step.gap) timeline.add(tween, '+=' + step.gap);
      else timeline.add(tween);
    });
  }

  restart.addEventListener('click', run);
  run();
})();
</script>
