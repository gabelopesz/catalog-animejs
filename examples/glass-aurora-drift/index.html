<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Aurora Drift (Fundo)</title>

<!-- Bootstrap 5 (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  :root{
    --brand-green: #2e9e4f;
  }

  html, body{
    height: 100%;
  }

  body{
    background: #060a07;
    min-height: 100vh;
    overflow: hidden;
  }

  .accent{ color: var(--brand-green); }

  .aurora-stage{
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Blurred color blobs drifting behind the glass panel form the
     "aurora" backdrop that the glassmorphism effect reveals through. */
  .blob{
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    will-change: transform;
    pointer-events: none;
  }

  .blob-a{
    top: 8%;
    left: 10%;
    width: 26rem;
    height: 26rem;
    background: radial-gradient(circle at 30% 30%, #3fd67a, transparent 70%);
    opacity: .55;
  }

  .blob-b{
    bottom: 5%;
    right: 8%;
    width: 22rem;
    height: 22rem;
    background: radial-gradient(circle at 60% 40%, #29b6a8, transparent 70%);
    opacity: .5;
  }

  .blob-c{
    top: 45%;
    right: 22%;
    width: 16rem;
    height: 16rem;
    background: radial-gradient(circle at 40% 40%, #7c5cff, transparent 70%);
    opacity: .4;
  }

  .blob-d{
    bottom: 30%;
    left: 20%;
    width: 14rem;
    height: 14rem;
    background: radial-gradient(circle at 50% 50%, #d8f24d, transparent 70%);
    opacity: .35;
  }

  /* --- Glass panel --------------------------------------------------- */
  .glass-panel{
    position: relative;
    z-index: 1;
    width: min(90%, 420px);
    padding: 2.25rem;
    border-radius: 1.25rem;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .16);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    box-shadow: 0 8px 40px rgba(0, 0, 0, .35);
  }

  .glass-chip{
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 2rem;
    padding: .35rem .9rem;
    font-size: .8rem;
    color: #e9ecef;
  }

  .glass-btn{
    background: rgba(46, 158, 79, .18);
    border: 1px solid rgba(46, 158, 79, .5);
    color: #eafff0;
    font-weight: 600;
    cursor: pointer;
  }

  .glass-btn:hover{
    background: rgba(46, 158, 79, .32);
    color: #fff;
  }
</style>
</head>
<body>

<div class="aurora-stage">

  <div class="blob blob-a" id="blob-a" data-base-opacity=".55"></div>
  <div class="blob blob-b" id="blob-b" data-base-opacity=".5"></div>
  <div class="blob blob-c" id="blob-c" data-base-opacity=".4"></div>
  <div class="blob blob-d" id="blob-d" data-base-opacity=".35"></div>

  <div class="glass-panel">
    <h2 class="h5 mb-2">Glass <span class="accent">Aurora</span></h2>
    <p class="text-secondary small mb-3">
      Manchas de cor desfocadas derivam lentamente atrás de um painel com
      <code>backdrop-filter: blur()</code>, revelando o efeito de vidro fosco
      típico do glassmorphism.
    </p>
    <div class="d-flex flex-wrap gap-2 mb-4">
      <span class="glass-chip">blur(22px)</span>
      <span class="glass-chip">saturate(150%)</span>
      <span class="glass-chip">anime.js loop</span>
    </div>
    <button type="button" class="btn glass-btn w-100" id="explore-btn">Explorar</button>
  </div>

</div>

<!-- anime.js (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

<script>
(function () {
  // Each blob drifts through a short loop of offsets/scales at its own pace,
  // so the field never settles into an obviously repeating rhythm.
  function drift(selector, opts) {
    anime({
      targets: selector,
      translateX: opts.x,
      translateY: opts.y,
      scale: opts.scale,
      duration: opts.duration,
      easing: 'easeInOutSine',
      loop: true
    });
  }

  drift('#blob-a', {
    x: [0, 60, -20, 0],
    y: [0, 40, 70, 0],
    scale: [1, 1.15, .95, 1],
    duration: 16000
  });

  drift('#blob-b', {
    x: [0, -50, 30, 0],
    y: [0, -60, -20, 0],
    scale: [1, .9, 1.1, 1],
    duration: 19000
  });

  drift('#blob-c', {
    x: [0, -40, 50, 0],
    y: [0, 50, -30, 0],
    scale: [1, 1.2, 1, 1],
    duration: 13000
  });

  drift('#blob-d', {
    x: [0, 35, -45, 0],
    y: [0, -35, 25, 0],
    scale: [1, .85, 1.1, 1],
    duration: 15000
  });

  // "Explorar" reacts with a press bounce on the button and a glow pulse
  // across the blobs (opacity only, so it never fights the drift loops
  // above, which already own each blob's transform).
  document.getElementById('explore-btn').addEventListener('click', function (e) {
    var btn = e.currentTarget;

    anime({
      targets: btn,
      scale: [1, .96, 1],
      duration: 260,
      easing: 'easeOutQuad'
    });

    anime({
      targets: '.blob',
      opacity: function (el) {
        var base = parseFloat(el.dataset.baseOpacity);
        return [base, Math.min(1, base + .35), base];
      },
      duration: 900,
      easing: 'easeOutQuad',
      delay: anime.stagger(80)
    });
  });
})();
</script>

</body>
</html>
