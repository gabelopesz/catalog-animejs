<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Trace Pulse (Fundo)</title>

<!-- Bootstrap 5 (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  :root{
    --brand-green: #2e9e4f;
  }

  html, body{
    height: 100%;
  }

  body{
    background: radial-gradient(circle at 50% 30%, #0a1a10 0%, #060c08 60%, #030503 100%);
    min-height: 100vh;
    overflow: hidden;
  }

  .accent{ color: var(--brand-green); }

  .circuit-stage{
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .circuit-svg{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Faint static trace, always visible, so the board reads as a circuit
     even where no pulse is currently travelling. */
  .circuit-trace-base{
    fill: none;
    stroke: rgba(46, 158, 79, .16);
    stroke-width: 1.5;
  }

  /* Bright dash that travels the same path via an animated dashoffset. */
  .circuit-trace-pulse{
    fill: none;
    stroke: #7dffb0;
    stroke-width: 2;
    filter: drop-shadow(0 0 6px rgba(125, 255, 176, .85));
  }

  .circuit-node{
    fill: var(--brand-green);
    filter: drop-shadow(0 0 4px rgba(46, 158, 79, .85));
    transform-box: fill-box;
    transform-origin: center;
  }

  /* --- Terminal panel ------------------------------------------------- */
  .tech-panel{
    position: relative;
    z-index: 1;
    width: min(90%, 460px);
    border-radius: .75rem;
    background: rgba(6, 12, 8, .75);
    border: 1px solid rgba(46, 158, 79, .35);
    box-shadow: 0 8px 40px rgba(0, 0, 0, .5);
    overflow: hidden;
  }

  .tech-panel-header{
    display: flex;
    align-items: center;
    gap: .4rem;
    padding: .55rem .9rem;
    background: rgba(46, 158, 79, .08);
    border-bottom: 1px solid rgba(46, 158, 79, .25);
  }

  .tech-dot{
    width: .55rem;
    height: .55rem;
    border-radius: 50%;
    background: rgba(255, 255, 255, .18);
  }

  .tech-panel-body{
    margin: 0;
    padding: 1.1rem 1.25rem 1.3rem;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: .85rem;
    line-height: 1.7;
    color: #d7ecdd;
    white-space: pre-wrap;
  }

  .tech-cursor{
    color: var(--brand-green);
  }
</style>
</head>
<body>

<div class="circuit-stage">

  <svg class="circuit-svg" id="circuit-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"></svg>

  <div class="tech-panel">
    <div class="tech-panel-header">
      <span class="tech-dot"></span>
      <span class="tech-dot"></span>
      <span class="tech-dot"></span>
      <span class="ms-auto small text-secondary">system.log</span>
    </div>
    <pre class="tech-panel-body"><span class="accent">$</span> inicializando módulos...
<span class="accent">$</span> rede: <span class="accent">online</span>
<span class="accent">$</span> latência: 12ms
<span class="accent">$</span> status: <span class="accent">estável</span><span class="tech-cursor">▌</span></pre>
  </div>

</div>

<!-- anime.js (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

<script>
(function () {
  var svg = document.getElementById('circuit-svg');
  var svgNS = 'http://www.w3.org/2000/svg';

  // Right-angle "PCB trace" paths spread across the canvas, kept mostly
  // clear of the centered terminal panel.
  var TRACES = [
    'M40,120 H300 V260 H620',
    'M1400,80 H1080 V220 H760 V400',
    'M60,780 H340 V560 H700',
    'M1380,820 H1040 V680 H680 V520',
    'M0,450 H180 V300 H420 V150',
    'M1440,500 H1220 V650 H900',
    'M200,40 V200 H500',
    'M1240,40 V180 H960 V320',
    'M40,560 V700 H260 V860'
  ];

  var NODES = [
    [300, 120], [300, 260], [620, 260],
    [1080, 80], [1080, 220], [760, 220], [760, 400],
    [340, 780], [340, 560], [700, 560],
    [1040, 820], [1040, 680], [680, 680], [680, 520],
    [180, 450], [180, 300], [420, 300],
    [1220, 500], [1220, 650],
    [200, 200], [500, 200],
    [1240, 180], [960, 180], [960, 320],
    [40, 700], [260, 700], [260, 860]
  ];

  // Each trace gets a dim static copy plus a bright copy whose dashoffset
  // is animated so a short glowing segment travels the full path in a
  // seamless loop (dash enters before the start, exits past the end).
  TRACES.forEach(function (d, i) {
    var base = document.createElementNS(svgNS, 'path');
    base.setAttribute('class', 'circuit-trace-base');
    base.setAttribute('d', d);
    svg.appendChild(base);

    var pulse = document.createElementNS(svgNS, 'path');
    pulse.setAttribute('class', 'circuit-trace-pulse');
    pulse.setAttribute('d', d);
    svg.appendChild(pulse);

    var length = pulse.getTotalLength();
    var dash = 70;
    pulse.style.strokeDasharray = dash + ' ' + (length + dash);

    anime({
      targets: pulse,
      strokeDashoffset: [dash, -length],
      duration: 2200 + i * 260,
      delay: i * 220,
      easing: 'linear',
      loop: true
    });
  });

  NODES.forEach(function (pos) {
    var node = document.createElementNS(svgNS, 'circle');
    node.setAttribute('class', 'circuit-node');
    node.setAttribute('cx', pos[0]);
    node.setAttribute('cy', pos[1]);
    node.setAttribute('r', 4);
    svg.appendChild(node);
  });

  anime({
    targets: '.circuit-node',
    scale: [1, 1.7, 1],
    opacity: [.55, 1, .55],
    duration: 2400,
    easing: 'easeInOutSine',
    loop: true,
    delay: anime.stagger(120, { from: 'center' })
  });

  anime({
    targets: '.tech-cursor',
    opacity: [1, 0],
    duration: 500,
    direction: 'alternate',
    easing: 'linear',
    loop: true
  });
})();
</script>

</body>
</html>
